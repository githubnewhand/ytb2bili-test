name: Build Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build and install whisper.cpp
      run: |
        git clone https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
        git -C /tmp/whisper.cpp checkout 764482c3175d
        cmake -S /tmp/whisper.cpp -B /tmp/whisper-build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DWHISPER_BUILD_TESTS=OFF \
          -DWHISPER_BUILD_EXAMPLES=OFF
        cmake --build /tmp/whisper-build --target whisper --parallel 2
        sudo cmake --install /tmp/whisper-build

    - name: Run tests
      run: go test -v ./...

    - name: Build binary
      run: go build -v -o ytb2bili-test .
        
    - name: Verify binary
      run: |
        chmod +x ytb2bili-test
        ls -la ytb2bili-test
        file ytb2bili-test
        echo "✅ Binary built successfully"